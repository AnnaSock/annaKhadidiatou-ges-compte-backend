services:
    # ===============================
    # 🧱 Application Laravel
    # ===============================
    app:
        build:
            context: .
            args:
                APP_ENV: ${APP_ENV:-local} # passer 'production' ou 'local'
        container_name: laravel-app
        restart: unless-stopped
        environment:
            APP_ENV: ${APP_ENV:-local}
            APP_DEBUG: ${APP_DEBUG:-1}
            APP_URL: ${APP_URL:-http://localhost}
            
        volumes:
            - ./:/var/www/html
        depends_on:
            - dbpostgres
        networks:
            - laravel-net
        ports:
            - "8081:8000" # pour dev uniquement, artisan serve
        command: >
            sh -c "if [ '${APP_ENV}' = 'production' ]; then
              php-fpm;
            else
              php artisan serve --host=0.0.0.0 --port=8000;
            fi"

    # ===============================
    # 🌐 Serveur Web Nginx (prod)
    # ===============================
    webserver:
        image: nginx:alpine
        container_name: laravel-nginx
        restart: unless-stopped
        depends_on:
            - app
        ports:
            - "8080:80" # accès public en prod
        volumes:
            - ./:/var/www/html
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - laravel-net
        # Ne démarre Nginx qu'en prod
        command: sh -c "if [ '${APP_ENV}' = 'production' ]; then nginx -g 'daemon off;'; else sleep infinity; fi"

    # ===============================
    # 🗄️ Base de données PostgreSQL
    # ===============================
    dbpostgres:
        image: postgres:15-alpine
        container_name: laravel-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: laravel_compte
            POSTGRES_PASSWORD: laravel_compte
            POSTGRES_DB: laravel_compte
        volumes:
            - db_data:/var/lib/postgresql/data
        networks:
            - laravel-net
        ports:
            - "5433:5432"

# ===============================
# 🔗 Réseau & volumes partagés
# ===============================
networks:
  laravel-net:
    name: laravel-networks
    driver: bridge

volumes:
    db_data:




